<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Web Speech 引擎自测</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0b0d10; color: #e8eaed; padding: 16px; max-width: 720px; margin: 0 auto;
    min-height: 100vh;
  }
  h1 { font-size: 18px; margin: 8px 0 4px; }
  .sub { color: #9aa0a6; font-size: 12px; line-height: 1.6; margin-bottom: 12px; }
  .banner { display: none; background: #3a2b12; color: #ffd479; border: 1px solid #7a5c1e; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin-bottom: 12px; }
  .banner a { color: inherit; }
  .card { background: #14171c; border: 1px solid #232830; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button.go {
    flex: 1; min-height: 52px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600;
    background: #2e7d5b; color: #fff; cursor: pointer; transition: background .15s;
  }
  button.go:disabled { background: #2a4a3c; color: #7fa896; cursor: default; }
  button.stop { background: #8c3a3a; }
  select { background: #1b2027; color: #e8eaed; border: 1px solid #2c333d; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .status { font-size: 13px; color: #9aa0a6; margin-top: 8px; min-height: 18px; }
  .text-box {
    margin-top: 10px; background: #0f1216; border: 1px dashed #2c333d; border-radius: 8px;
    padding: 10px; min-height: 48px; font-size: 15px; line-height: 1.5; word-break: break-all;
  }
  .text-box .interim { color: #8ab4f8; }
  .log { max-height: 260px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.7; }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: #2c333d; border-radius: 3px; }
  .log .t { color: #5f6672; margin-right: 8px; }
  .log .ok { color: #57c98a; }
  .log .err { color: #ef7a70; }
  .log .info { color: #9aa0a6; }
  .log .evt { color: #8ab4f8; }
  .verdict { display: none; margin-top: 12px; border-radius: 12px; padding: 14px; font-size: 14px; line-height: 1.8; }
  .verdict.ok { display: block; background: #10331f; border: 1px solid #1f6641; color: #7ee2a8; }
  .verdict.bad { display: block; background: #331d1d; border: 1px solid #663030; color: #ef9a8a; }
  .verdict.warn { display: block; background: #332b12; border: 1px solid #66601e; color: #ffd479; }
  .verdict b { font-size: 15px; }
  .env { font-size: 12px; color: #5f6672; line-height: 1.8; margin-top: 10px; word-break: break-all; }
</style>
</head>
<body>
  <h1>Web Speech 引擎自测（纯浏览器 API）</h1>
  <div class="sub">
    本页只调用浏览器原生 <b>SpeechRecognition</b>——不含 getUserMedia、不含 MediaRecorder、不含任何应用代码。
    点开始后正常说话，事件流与结论见下方；若本页也失败，说明问题在浏览器/网络/系统层，与应用代码无关。
  </div>
  <div id="iframeBanner" class="banner">
    当前页面在框架（iframe）内运行，框架可能限制麦克风权限。
    请<a href="/ws-test.html" target="_blank" rel="noopener">在新标签页直接打开本页</a>再测试。
  </div>

  <div class="card">
    <div class="row">
      <select id="lang">
        <option value="zh-CN" selected>中文（zh-CN）</option>
        <option value="en-US">English（en-US）</option>
      </select>
      <button id="go" class="go">开始测试</button>
    </div>
    <div id="status" class="status">待开始</div>
    <div id="textBox" class="text-box">识别内容将显示在这里…</div>
    <div id="verdict" class="verdict"></div>
    <div id="env" class="env"></div>
  </div>

  <div class="card">
    <div class="log" id="log"></div>
  </div>

<script>
(function () {
  var Ctor = window.SpeechRecognition || window.webkitSpeechRecognition
  var $ = function (id) { return document.getElementById(id) }
  var go = $('go'), statusEl = $('status'), textBox = $('textBox'),
      verdictEl = $('verdict'), logEl = $('log'), langSel = $('lang')

  /* 环境信息 */
  try {
    $('env').textContent = '安全上下文: ' + (window.isSecureContext ? '是' : '否(非 HTTPS)') +
      ' ｜ 引擎类: ' + (Ctor ? (window.SpeechRecognition ? 'SpeechRecognition' : 'webkitSpeechRecognition') : '无') +
      ' ｜ ' + navigator.userAgent.slice(0, 80)
  } catch (e) {}
  if (window !== window.top) $('iframeBanner').style.display = 'block'
  if (!Ctor) {
    go.disabled = true
    statusEl.textContent = '当前浏览器不支持 Web Speech API'
    show('bad', '❌ 当前浏览器没有 SpeechRecognition（iOS Safari / Firefox / 部分安卓 WebView 常见）', '请改用 Chrome / Edge，或使用应用的「服务端识别」引擎。')
    return
  }
  if (!window.isSecureContext) {
    show('warn', '⚠️ 非安全上下文（HTTP）', '麦克风类 API 需要 HTTPS 或 localhost。请把本站部署到 HTTPS 后再测。')
  }

  var running = false
  var finished = false
  var rec = null
  var t0 = 0
  var total = ''
  var restarts = 0
  var quickEmpty = 0
  var sawStart = false, sawAudio = false, sawSpeech = false, sawResult = false
  var fatal = null
  var stopTimer = 0
  var MAX_RESTART = 3
  var AUTO_STOP = 30000

  function log(cls, evt, msg) {
    var line = document.createElement('div')
    var t = running ? (Date.now() - t0) : 0
    line.innerHTML = '<span class="t">' + String(t).padStart(5, '0') + 'ms</span>' +
      '<span class="evt">' + evt + '</span> <span class="' + cls + '">' + msg + '</span>'
    logEl.appendChild(line)
    logEl.scrollTop = logEl.scrollHeight
    if (window.console && console.debug) console.debug('[ws-test]', evt, msg)
  }

  function show(kind, title, detail) {
    verdictEl.className = 'verdict ' + kind
    verdictEl.innerHTML = '<b>' + title + '</b><br/>' + (detail || '')
  }

  function setStatus(s) { statusEl.textContent = s }

  function renderText(interim) {
    textBox.innerHTML = total ? total : ''
    if (interim) textBox.innerHTML += '<span class="interim">' + interim + '</span>'
    if (!total && !interim) textBox.textContent = '（未识别到内容）'
  }

  function newInstance() {
    var r = new Ctor()
    r.lang = langSel.value
    r.continuous = true
    r.interimResults = true
    r.maxAlternatives = 1
    r.onstart = function () { sawStart = true; log('ok', 'onstart', '引擎已启动') }
    if ('onaudiostart' in r) r.onaudiostart = function () { sawAudio = true; log('ok', 'onaudiostart', '音频流已建立') }
    if ('onsoundstart' in r) r.onsoundstart = function () { log('ok', 'onsoundstart', '检测到声音') }
    if ('onspeechstart' in r) r.onspeechstart = function () { sawSpeech = true; log('ok', 'onspeechstart', '检测到语音') }
    r.onresult = function (e) {
      sawResult = true
      var interim = ''
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var r2 = e.results[i]
        if (!r2[0]) continue
        if (r2.isFinal) total += r2[0].transcript
        else interim += r2[0].transcript
      }
      renderText(interim)
      if (total) log('ok', 'onresult', '已识别 ' + total.length + ' 字：' + total.slice(-20))
    }
    r.onerror = function (e) {
      var code = e.error || 'unknown'
      log('err', 'onerror', code)
      if (code !== 'no-speech' && code !== 'aborted') fatal = code
    }
    r.onend = function () {
      if (r !== rec) return /* 旧实例的迟到事件，忽略 */
      log('info', 'onend', '本轮结束')
      rec = null
      if (!running) return
      if (fatal) { finish(); return }
      var elapsed = Date.now() - t0
      if (!total && !sawStart && elapsed < 1500) quickEmpty++
      if (restarts < MAX_RESTART) {
        restarts++
        log('info', 'restart', '换新实例继续听（第 ' + restarts + ' 次重启）')
        setTimeout(function () {
          if (running && !fatal) {
            rec = newInstance()
            try { rec.start() } catch (e) { log('err', 'start()', '抛异常：' + (e && e.message)); fatal = 'start-failed'; finish() }
          }
        }, 300)
        return
      }
      finish()
    }
    return r
  }

  function finish() {
    if (finished || !running) return
    finished = true
    running = false
    clearTimeout(stopTimer)
    try { rec && rec.abort() } catch (e) {}
    rec = null
    go.disabled = false
    go.textContent = '重新测试'
    go.classList.remove('stop')
    setStatus('测试结束（共 ' + ((Date.now() - t0) / 1000).toFixed(1) + ' 秒，重启 ' + restarts + ' 次）')
    renderText('')
    /* 结论判定 */
    if (fatal === 'not-allowed' || fatal === 'service-not-allowed') {
      show('bad', '❌ 麦克风权限被拒绝', '浏览器设置里把本站麦克风权限改为「允许」后重测。')
    } else if (fatal === 'network') {
      show('bad', '❌ 网络无法访问浏览器语音服务（network）',
        'Chrome/Edge 的 SpeechRecognition 需连接 Google 语音服务，大陆网络常被屏蔽。' +
        '这属于环境限制，与页面代码无关——应用里的「服务端识别」引擎不受影响，可正常使用。')
    } else if (fatal === 'audio-capture') {
      show('bad', '❌ 未检测到麦克风设备', '检查系统是否插入了麦克风、是否被禁用。')
    } else if (total) {
      show('ok', '✅ 引擎正常：能识别语音',
        '识别到「' + total.slice(0, 30) + (total.length > 30 ? '…' : '') + '」。本环境 Web Speech 可用；' +
        '若应用内仍失败，请反馈应用控制台的 [WebSpeech] 日志。')
    } else if (quickEmpty >= 2 && !sawStart) {
      show('bad', '❌ 引擎无法启动（启动后秒级静默结束、无任何事件）',
        '这是「浏览器语音服务不可达」的典型表现（Chrome/Edge 需连 Google 语音服务，大陆网络常被屏蔽），' +
        '也与浏览器策略限制同症状。与应用代码无关——换网络（如手机热点/代理）对比可验证；' +
        '应用里的「服务端识别」引擎不受影响。')
    } else if (sawStart && sawAudio && !sawSpeech) {
      show('warn', '⚠️ 引擎已启动、音频流已建立，但未检测到语音',
        '检查：① 系统默认输入设备是否正确（Windows 声音设置）；② 麦克风音量/静音；' +
        '③ 蓝牙耳机需输入输出同为同一设备；④ 在线麦克风测试工具能否看到波形。')
    } else {
      show('warn', '⚠️ 本轮未识别到语音', '可能只是没来得及说话（每轮约 8 秒超时会自动换新实例续听）。再测一次并正常说话。')
    }
  }

  go.addEventListener('click', function () {
    if (running) {
      running = false
      clearTimeout(stopTimer)
      try { rec && rec.stop() } catch (e) {}
      rec = null
      setStatus('已手动停止')
      go.disabled = false
      go.textContent = '重新测试'
      go.classList.remove('stop')
      renderText('')
      if (total) show('ok', '✅ 引擎正常：能识别语音', '识别到「' + total.slice(0, 30) + '」')
      else show('warn', '已手动停止', '未识别到内容，可再测一次。')
      return
    }
    /* 每次测试都从全新状态开始 */
    finished = false
    running = true
    total = ''
    restarts = 0
    quickEmpty = 0
    sawStart = sawAudio = sawSpeech = sawResult = false
    fatal = null
    t0 = Date.now()
    logEl.innerHTML = ''
    verdictEl.className = 'verdict'
    textBox.textContent = '正在聆听，请说话…'
    go.disabled = true
    go.textContent = '停止'
    go.classList.add('stop')
    setStatus('正在聆听（连续模式，最多 ' + (AUTO_STOP / 1000) + ' 秒）…')
    log('info', 'test', '开始：lang=' + langSel.value + '，continuous=true，interimResults=true')
    rec = newInstance()
    try {
      rec.start()
    } catch (e) {
      log('err', 'start()', '抛异常：' + (e && e.message))
      fatal = 'start-failed'
      finish()
      return
    }
    stopTimer = setTimeout(function () {
      log('info', 'timeout', AUTO_STOP / 1000 + ' 秒到，自动停止并给出结论')
      finish()
    }, AUTO_STOP)
  })
})()
</script>
</body>
</html>
